name: Deploy demo to GitHub Pages

# 把 demo/ 目录发布为 GitHub Pages 站点
# 触发：推送到 main，或在 Actions 页面手动运行

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的顶掉旧排队
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未开启 Pages 时，由工作流自动开启（否则会报 "Get Pages site failed"）
          enablement: true

      - name: Upload demo/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
